<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — DİZİ.MODA.AI</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b0c; color: #f5f1e8;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 48px 20px;
  }
  .cerceve { position: fixed; inset: 14px; border: 1px solid #c9a22766; pointer-events: none; }
  h1 { font-size: 34px; letter-spacing: 4px; color: #c9a227; font-weight: normal; }
  .alt { font-style: italic; color: #b9b3a4; margin: 14px 0 26px; font-size: 15px; text-align: center; }
  .cizgi { width: 120px; height: 1px; background: #c9a227; margin: 0 auto 30px; }
  a.btn {
    display: block; text-decoration: none; text-align: center;
    padding: 14px 28px; font-size: 16px; letter-spacing: 0.5px;
    border: 1px solid #c9a227; color: #f5f1e8; background: #131315;
    transition: background 0.2s;
  }
  a.btn:hover { background: #1d1d20; }
</style>
</head>
<body>
<div class="cerceve"></div>
<h1>404 — BU SAHNE YOK</h1>
<p class="alt">Aradığınız sayfa kurguya karışmadı galiba.</p>
<div class="cizgi"></div>
<a class="btn" href="/">← Ana sayfaya dön</a>
</body>
</html>
