<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stil Kartları — Dizi.ModA.ai</title>
<meta name="description" content="Tüm stil kartları resimleriyle: her karakterin imza kombinleri, stil DNA'sı ve kendi hashtag'i. Dizilerin ikonik tarzları AI ile yeniden yorumlandı.">
<meta name="google-site-verification" content="CqaiGjzWfRBunBvJqAQmAnxclcmL3ai0lUjE1yqb8_E">
<meta name="p:domain_verify" content="92b58e68d94e7959461e90c807032e57"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b0c; color: #f5f1e8;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 48px 20px 40px;
  }
  .cerceve { position: fixed; inset: 14px; border: 1px solid #c9a22766; pointer-events: none; }
  .amblem { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #c9a227;
            object-fit: cover; margin-bottom: 14px; }
  h1 { font-size: 26px; letter-spacing: 3px; color: #c9a227; font-weight: normal; text-align: center; }
  .alt { font-style: italic; color: #b9b3a4; margin: 8px 0 4px; font-size: 14px; text-align: center; }
  .cizgi { width: 120px; height: 1px; background: #c9a227; margin: 18px auto; }
  .donus { font-size: 13px; color: #c9a227; text-decoration: none; letter-spacing: 1px;
           border-bottom: 1px solid #c9a22766; padding-bottom: 2px; margin-bottom: 6px; }
  .bolum { width: 100%; max-width: 560px; margin: 18px auto 20px; text-align: center; }
  .bolum .baslik { font-size: 14px; letter-spacing: 4px; color: #c9a227; }
  .bolum .cizgi-kisa { width: 60px; height: 1px; background: #c9a22799; margin: 12px auto 0; }
  .izgara { width: 100%; max-width: 1000px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
            gap: 14px; margin-bottom: 26px; }
  .kart { border: 1px solid #c9a22744; background: #121214; overflow: hidden;
          transition: border-color 0.2s, transform 0.15s; }
  .kart:hover { border-color: #c9a227aa; transform: translateY(-2px); }
  .kart img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top;
              display: block; }
  .kart .govde { padding: 13px 15px 15px; }
  .kart .ad { font-size: 17px; letter-spacing: 2px; color: #c9a227; }
  .kart .dna { font-size: 12.5px; color: #b9b3a4; font-style: italic;
               margin: 7px 0 11px; line-height: 1.55; }
  .kart .etiket { display: inline-block; font-size: 11px; letter-spacing: 1px; color: #c9a227;
                  border: 1px solid #c9a22766; padding: 5px 10px; text-decoration: none; }
  .kart .etiket:hover { background: #1d1d20; }
  footer { margin-top: 36px; font-size: 12.5px; color: #8d8778; text-align: center;
           line-height: 1.7; font-style: italic; }
  footer a { color: #c9a227; text-decoration: none; border-bottom: 1px solid #c9a22766; }
</style>
</head>
<body>
<div class="cerceve"></div>

<img class="amblem" src="profil.jpg" alt="Dizi.ModA.ai">
<h1>STİL KARTLARI</h1>
<p class="alt">Her karakterin imza kombini · AI ile yeniden yorumlandı</p>
<div class="cizgi"></div>
<a class="donus" href="index.html">← ana sayfa</a>

<div class="bolum">
  <div class="baslik">TÜM KARAKTERLER</div>
  <div class="cizgi-kisa"></div>
</div>

<div class="izgara" id="kartlar"></div>

<footer>
  Tüm karakter görselleri yapay zeka ile üretilmiştir · Kişiler ve markalarla bağı yoktur<br>
  © dizi.moda.ai · <a href="index.html">ana sayfa</a> ·
  <a href="gizlilik.html">Gizlilik Politikası</a>
</footer>

<script>
(function () {
  function etiketLinki(e) {
    if (!e || e.charAt(0) !== "#") return "";
    var q = encodeURIComponent(e.slice(1));
    return '<a class="etiket" href="https://www.instagram.com/explore/tags/' + q +
      '/" target="_blank" rel="noopener">' + e + '</a>';
  }
  function kart(k) {
    var icerik = k.resim
      ? '<img src="' + k.resim + '" alt="' + k.ad + ' — yapay zeka ile üretilmiş stil görseli" loading="lazy">'
      : '';
    return '<div class="kart">' + icerik +
      '<div class="govde">' +
      '<div class="ad">' + k.ad + '</div>' +
      '<div class="dna">' + k.dna + '</div>' +
      etiketLinki(k.etiket) +
      '</div></div>';
  }
  fetch("kartlar.json")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var el = document.getElementById("kartlar");
      if (!d.kartlar || !d.kartlar.length) { el.style.display = "none"; return; }
      el.innerHTML = d.kartlar.map(kart).join("");
    })
    .catch(function () { document.getElementById("kartlar").style.display = "none"; });
})();
</script>
</body>
</html>
